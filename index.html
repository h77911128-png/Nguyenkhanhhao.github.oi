<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangaccfree90 - Digital Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {

            );

            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;

        /* Đăng nhập / đăng ký */
        .auth-zone {
            text-align: right;
            max-width: 650px;
            margin: 0 auto 10px;
            padding-right: 5px;
        }

        .auth-zone a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-zone a:hover {
            color: #38bdf8;
        }

        .hub-header {
            max-width: 650px;
            margin: 0 auto 20px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hub-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            height: 36px;

            align-items: center;
            justify-content: center;

        }

            font-weight: 700;
            letter-spacing: 0.5px;
        }

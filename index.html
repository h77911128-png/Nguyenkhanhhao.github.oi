<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Acc Liên Quân</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #0f172a; color: #f8fafc; padding-top: 80px; margin: 0; }
        
        /* Phần Đăng nhập / Đăng ký ở góc trái trên cùng */
        .auth-buttons { position: absolute; top: 20px; left: 20px; font-size: 14px; }
        .auth-buttons a { color: #38bdf8; text-decoration: none; font-weight: 500; transition: 0.2s; cursor: pointer; }
        .auth-buttons a:hover { color: #7dd3fc; text-decoration: underline; }
        .auth-buttons span { color: #64748b; margin: 0 5px; }

        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        button { background-color: #0284c7; color: white; border: none; padding: 15px 35px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 20px; }
        button:hover { background-color: #0369a1; transform: scale(1.02); }
        .result { margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 8px; display: none; text-align: left; border-left: 5px solid #38bdf8; }
        .result p { margin: 8px 0; font-size: 16px; }
        .error { color: #f43f5e; font-weight: bold; margin-top: 15px; }
        .success { color: #10b981; margin-top: 15px; font-size: 14px; }

        /* Giao diện khung điền thông tin (Modal Popup) */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
        .modal-content { background-color: #1e293b; margin: 15% auto; padding: 25px; border: 1px solid #475569; width: 90%; max-width: 360px; border-radius: 12px; text-align: left; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .modal h3 { margin-top: 0; color: #38bdf8; }
        .close { float: right; font-size: 24px; font-weight: bold; color: #94a3b8; cursor: pointer; }
        .close:hover { color: #f8fafc; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: #f8fafc; box-sizing: border-box; font-size: 15px; }
        .form-group input:focus { border-color: #38bdf8; outline: none; }
        .btn-submit { width: 100%; background-color: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 5px; }
        .btn-submit:hover { background-color: #059669; }
        .form-error { color: #f43f5e; font-size: 13px; margin-top: 5px; display: none; font-weight: 500; }
    </style>
</head>
<body>

<!-- Nút Đăng nhập / Đăng ký góc trái -->
<div class="auth-buttons">
    <a onclick="openModal('login')">Đăng nhập</a>
    <span>/</span>
    <a onclick="openModal('register')">Đăng ký</a>
</div>

<!-- Khung Form điền thông tin chung cho cả 2 tính năng -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Đăng ký thành viên</h3>
        
        <div class="form-group">
            <label for="username">Tên tài khoản:</label>
            <input type="text" id="username" placeholder="Nhập tên tài khoản...">
        </div>
        
        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
            <div id="validationError" class="form-error"></div>
        </div>
        
        <button class="btn-submit" id="btnSubmit" onclick="xuLyForm()">Xác nhận</button>
    </div>
</div>

<div class="container">
    <h2>🎉 VÒNG QUAY RANDOM ACC LQ 🎉</h2>
    <p style="color: #94a3b8;">Bấm nút bên dưới để nhận tài khoản ngẫu nhiên từ kho</p>
    <button onclick="quayRandom()">BẮT ĐẦU RANDOM</button>

    <div id="ketQua" class="result">
        <p><strong>👤 Tài khoản:</strong> <span id="txtTaiKhoan" style="color: #38bdf8; font-family: monospace; font-size: 18px;"></span></p>
        <p><strong>🔑 Mật khẩu:</strong> <span id="txtMatKhau" style="color: #f43f5e; font-family: monospace; font-size: 18px;"></span></p>
    </div>
    <p id="txtThongBao"></p>
</div>

<script>
let khoAcc = [
    { tk: "cuong6bbn", mk: "cuongcvbn123" },
    { tk: "hoaianh2689", mk: "0584903919Anh" },
    { tk: "daivipbnvn22", mk: "anhyasuo123" }
];

let currentAction = 'register'; // Biến kiểm tra đang bấm Đăng ký hay Đăng nhập

function openModal(action) {
    currentAction = action;
    const modal = document.getElementById("authModal");
    const title = document.getElementById("modalTitle");
    const btn = document.getElementById("btnSubmit");
    
    // Đổi chữ tiêu đề form tùy theo người dùng bấm nút nào
    if (action === 'login') {
        title.innerText = "Đăng nhập hệ thống";
        btn.innerText = "Đăng nhập";
    } else {
        title.innerText = "Đăng ký thành viên";
        btn.innerText = "Đăng ký ngay";
    }
    
    // Xóa dữ liệu cũ trong ô nhập nếu có
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("validationError").style.display = "none";
    
    modal.style.display = "block";
}

function closeModal() {
    document.getElementById("authModal").style.display = "none";
}

// Hàm xử lý kiểm tra tài khoản mật khẩu khi bấm nút xác nhận
function xuLyForm() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value;
    const errDiv = document.getElementById("validationError");
    
    errDiv.style.display = "none";
    errDiv.innerText = "";

    // 1. Kiểm tra điều kiện Tên tài khoản (>= 5 ký tự)
    if (user.length < 5) {
        errDiv.innerText = "❌ Tên tài khoản phải từ 5 ký tự trở lên!";
        errDiv.style.display = "block";
        return;
    }

    // 2. Kiểm tra điều kiện Mật khẩu bằng biểu thức Regular Expression
    const hasLower = /[a-z]/.test(pass);        // Có chữ thường
    const hasUpper = /[A-Z]/.test(pass);        // Có chữ hoa
    const hasUnderscore = /_/.test(pass);       // Có dấu gạch dưới

    if (!hasLower || !hasUpper || !hasUnderscore) {
        errDiv.innerText = "❌ Mật khẩu cần có: chữ viết thường, chữ viết hoa và dấu gạch dưới (_).";
        errDiv.style.display = "block";
        return;
    }

    // Nếu vượt qua tất cả các kiểm tra điều kiện thành công
    if (currentAction === 'register') {
        alert("🎉 Đăng ký tài khoản thành công!");
    } else {
        alert("🔓 Đăng nhập thành công!");
    }
    closeModal();
}

function quayRandom() {
    var resDiv = document.getElementById("ketQua");
    var thongBao = document.getElementById("txtThongBao");

    if (khoAcc.length === 0) {
        resDiv.style.display = "none";
        thongBao.className = "error";
        thongBao.innerText = "❌ Kho đã hết tài khoản để random!";
        return;
    }

    var randomIndex = Math.floor(Math.random() * khoAcc.length);
    var accTrung = khoAcc[randomIndex];

    document.getElementById("txtTaiKhoan").innerText = accTrung.tk;
    document.getElementById("txtMatKhau").innerText = accTrung.mk;
    resDiv.style.display = "block";

    khoAcc.splice(randomIndex, 1);
    thongBao.className = "success";
    thongBao.innerText = "ℹ️ Đã lấy 1 acc. Trong kho còn lại: " + khoAcc.length + " acc.";
}

// Đóng form khi nhấn trượt ra ngoài vùng hộp thoại
window.onclick = function(event) {
    const modal = document.getElementById("authModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
</script>

</body>
</html>

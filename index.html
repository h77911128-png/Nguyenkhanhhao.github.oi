<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTDShare - Digital Hub</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #090a0f 0%, #15102a 50%, #061626 100%); 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px 10px;
            min-height: 100vh;
        }

        /* Top Header Giao diện mẫu */
        .hub-header {
            max-width: 650px;
            margin: 0 auto 20px auto;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .hub-brand { display: flex; align-items: center; gap: 12px; }
        .hub-icon {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            width: 36px;
            height: 36px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }
        .hub-title { text-align: left; }
        .hub-title h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
        .hub-title p { margin: 0; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        
        .hub-status { display: flex; align-items: center; gap: 10px; }
        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .btn-refresh {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Khu vực nút hệ thống Đăng nhập / Đăng ký ẩn gọn bên phải */
        .auth-zone { text-align: right; max-width: 650px; margin: 0 auto 10px auto; padding-right: 5px; }
        .auth-zone a { color: #94a3b8; text-decoration: none; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .auth-zone a:hover { color: #38bdf8; }

        /* Khung danh sách các Mục sản phẩm */
        .list-container {
            max-width: 650px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* Từng thẻ hàng hóa / Mod Item */
        .mod-item {
            background: #ffffff;
            color: #1e293b;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: left;
        }
        .mod-item:last-child { margin-bottom: 0; }
        .mod-avatar {
            width: 54px;
            height: 54px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #f1f5f9;
        }
        .mod-info { flex: 1; }
        .mod-name { font-size: 15px; font-weight: 700; color: #0f172a; margin: 0 0 4px 0; }
        .mod-desc { font-size: 11px; color: #64748b; margin: 0 0 12px 0; font-weight: 500; }
        
        /* Cụm nút hành động bên dưới mỗi thẻ */
        .mod-actions { display: flex; gap: 8px; }
        .btn-download {
            flex: 1;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-download:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-key {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            padding: 0 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-key:hover { background: #e2e8f0; color: #0f172a; }

        /* Hộp thoại thông báo trúng thưởng ngẫu nhiên */
        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            display: none;
            color: #e0f2fe;
            font-size: 14px;
        }

        /* Giao diện Popup đăng ký / đăng nhập */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; margin: 30% auto; padding: 25px; border: 1px solid #334155; width: 85%; max-width: 340px; border-radius: 16px; text-align: left; }
        .modal h3 { margin: 0 0 15px 0; color: #38bdf8; font-size: 18px; }
        .close { float: right; font-size: 20px; color: #64748b; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        .form-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .form-error { color: #f43f5e; font-size: 12px; margin-top: 5px; display: none; }
    </style>
</head>
<body>

    <!-- Khu vực tài khoản hệ thống -->
    <div class="auth-zone">
        <a onclick="openModal('login')">Đăng nhập</a> <span style="color:#334155">|</span> <a onclick="openModal('register')">Đăng ký</a>
    </div>

    <!-- Thanh tiêu đề dạng Header HUB giống ảnh -->
    <div class="hub-header">
        <div class="hub-brand">
            <div class="hub-icon">⚡</div>
            <div class="hub-title">
                <h1>NTDShare</h1>
                <p>Digital Hub</p>
            </div>
        </div>
        <div class="hub-status">
            <div class="status-badge">• ONLINE</div>
            <button class="btn-refresh" onclick="window.location.reload()">↻</button>
        </div>
    </div>

    <!-- Khung Danh sách mục -->
    <div class="list-container">
        
        <!-- Mục số 1: CHẤP TỐ ANDROID -->
        <div class="mod-item">
            <img class="mod-avatar" src="https://imgur.com" onerror="this.src='https://placehold.co'">
            <div class="mod-info">
                <div class="mod-name">CHẤP TỐ ANDROID</div>
                <div class="mod-desc">10 vé / 24h ( 1 game k được dồn quá 3 vé )</div>
                <div class="mod-actions">
                    <button class="btn-download" onclick="quayRandomAcc('Mục Chấp Tố Android')">📥 Tải Xuống</button>
                    <button class="btn-key" onclick="alert('Chức năng nhận mã bản quyền đang bảo trì!')">🔑 Get Key</button>
                </div>
            </div>
        </div>

        <!-- Mục số 2: MAP NTD MOD -->
        <div class="mod-item">
            <img class="mod-avatar" src="https://imgur.com" onerror="this.src='https://placehold.co'">
            <div class="mod-info">
                <div class="mod-name">MAP NTD MOD</div>
                <div class="mod-desc">HACK MAP - MOD FULL SKIN 3S KHÔNG TRẬN ẢO</div>
                <div class="mod-actions">
                    <button class="btn-download" onclick="quayRandomAcc('Mục Map NTD Mod')">📥 Tải Xuống</button>
                    <button class="btn-key" onclick="alert('Chức năng nhận mã bản quyền đang bảo trì!')">🔑 Get Key</button>
                </div>
            </div>
        </div>

        <!-- Mục số 3: IOS CHẤP TỐ -->
        <div class="mod-item">
            <img class="mod-avatar" src="https://imgur.com" onerror="this.src='https://placehold.co'">
            <div class="mod-info">
                <div class="mod-name">IOS CHẤP TỐ</div>
                <div class="mod-desc">15 vé / 24h - MOD FULL SKIN 3S KHÔNG LỖI</div>
                <div class="mod-actions">
                    <button class="btn-download" onclick="quayRandomAcc('Mục IOS Chấp Tố')">📥 Tải Xuống</button>
                    <button class="btn-key" onclick="alert('Chức năng nhận mã bản quyền đang bảo trì!')">🔑 Get Key</button>
                </div>
            </div>
        </div>

        <!-- Khung hiển thị tài khoản khi bấm nút Tải xuống (Random) -->
        <div id="ketQuaRandom" class="result-box"></div>
    </div>

    <!-- Hộp thoại Form Điền Đăng ký / Đăng nhập -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>

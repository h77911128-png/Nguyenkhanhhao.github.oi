<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Acc Liên Quân</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #0f172a; color: #f8fafc; padding-top: 80px; margin: 0; }
        
        /* Phần Đăng nhập / Đăng ký ở góc trái trên cùng */
        .auth-buttons { position: absolute; top: 20px; left: 20px; font-size: 14px; }
        .auth-buttons a { color: #38bdf8; text-decoration: none; font-weight: 500; transition: 0.2s; }
        .auth-buttons a:hover { color: #7dd3fc; text-decoration: underline; }
        .auth-buttons span { color: #64748b; margin: 0 5px; }

        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        button { background-color: #0284c7; color: white; border: none; padding: 15px 35px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 20px; }
        button:hover { background-color: #0369a1; transform: scale(1.02); }
        .result { margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 8px; display: none; text-align: left; border-left: 5px solid #38bdf8; }
        .result p { margin: 8px 0; font-size: 16px; }
        .error { color: #f43f5e; font-weight: bold; margin-top: 15px; }
        .success { color: #10b981; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<!-- Nút Đăng nhập / Đăng ký góc trái -->
<div class="auth-buttons">
    <a href="#" onclick="alert('Tính năng Đăng nhập đang được phát triển!')">Đăng nhập</a>
    <span>/</span>
    <a href="#" onclick="alert('Tính năng Đăng ký đang được phát triển!')">Đăng ký</a>
</div>

<div class="container">
    <h2>🎉 VÒNG QUAY RANDOM ACC LQ 🎉</h2>
    <p style="color: #94a3b8;">Bấm nút bên dưới để nhận tài khoản ngẫu nhiên từ kho</p>
    <button onclick="quayRandom()">BẮT ĐẦU RANDOM</button>

    <div id="ketQua" class="result">
        <p><strong>👤 Tài khoản:</strong> <span id="txtTaiKhoan" style="color: #38bdf8; font-family: monospace; font-size: 18px;"></span></p>
        <p><strong>🔑 Mật khẩu:</strong> <span id="txtMatKhau" style="color: #f43f5e; font-family: monospace; font-size: 18px;"></span></p>
    </div>
    <p id="txtThongBao"></p>
</div>

<script>
let khoAcc = [
    { tk: "cuong6bbn", mk: "cuongcvbn123" },
    { tk: "hoaianh2689", mk: "0584903919Anh" },
    { tk: "daivipbnvn22", mk: "anhyasuo123" }
];

function quayRandom() {
    var resDiv = document.getElementById("ketQua");
    var thongBao = document.getElementById("txtThongBao");

    if (khoAcc.length === 0) {
        resDiv.style.display = "none";
        thongBao.className = "error";
        thongBao.innerText = "❌ Kho đã hết tài khoản để random!";
        return;
    }

    var randomIndex = Math.floor(Math.random() * khoAcc.length);
    var accTrung = khoAcc[randomIndex];

    document.getElementById("txtTaiKhoan").innerText = accTrung.tk;
    document.getElementById("txtMatKhau").innerText = accTrung.mk;
    resDiv.style.display = "block";

    khoAcc.splice(randomIndex, 1);
    thongBao.className = "success";
    thongBao.innerText = "ℹ️ Đã lấy 1 acc. Trong kho còn lại: " + khoAcc.length + " acc.";
}
</script>

</body>
</html>
